<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I am sorry</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fredoka', sans-serif;
}

/* ❗ FIX: jangan overflow hidden global */
body {
    margin: 0;
    height: 100vh;
    background: url('bgpink.jpeg') center/cover no-repeat;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255, 182, 193, 0.15);
}

/* GAME AREA */
#gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* KARAKTER (RESPONSIVE) */
.karakter {
    position: absolute;
    width: clamp(70px, 12vw, 120px);
    height: clamp(70px, 12vw, 120px);
    background-image: url('kakqay.png');
    background-size: contain;
    background-repeat: no-repeat;
    animation: float 2s ease-in-out infinite;
}

/* HATI */
.hati {
    position: absolute;
    width: 38px;
    height: 38px;
    background-image: url('hati.png');
    background-size: contain;
    animation: pulse 1.6s infinite;
}

/* LAYAR */
.layar {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    text-align: center;
}

/* ❗ FIX CARD RESPONSIVE */
.cardCute,
.cardCute2 {
    width: min(90vw, 420px); /* penting */
    background: url('box.png') center/100% 100% no-repeat;
    padding: 80px 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* JUDUL */
.judul {
    font-size: clamp(18px, 5vw, 28px);
    font-family: 'Press Start 2P', cursive;
    color: #ff4f95;
}

/* BUTTON */
.btnCute {
    width: min(70vw, 250px);
    height: 55px;
    background: url('button.png') center/100% 100% no-repeat;
    border: none;
    font-weight: bold;
}

/* PESAN */
#kotakPesan {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

/* ANIMASI */
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* 📱 MOBILE FIX */
@media (max-width: 480px) {
    .cardCute,
    .cardCute2 {
        padding: 60px 20px;
    }
}
</style>
</head>

<body>

<div id="gameArea">

    <!-- START -->
    <div id="layarAwal" class="layar">
        <div class="cardCute">
            <h1 class="judul">Selamat Datang!</h1>
            <p>Ada 5 hati tersembunyi</p>
            <button onclick="mulaiGame()" class="btnCute">Mulai</button>
        </div>
    </div>

    <!-- KARAKTER -->
    <div id="karakter" class="karakter"></div>

</div>

<script>
let posX = 50, posY = 80;
const elKarakter = document.getElementById('karakter');

function posisi() {
    elKarakter.style.left = posX + "%";
    elKarakter.style.top = posY + "%";
}
posisi();

function mulaiGame() {
    document.getElementById("layarAwal").style.display = "none";
}

/* gerak */
let x0, y0;

gameArea.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
});

gameArea.addEventListener("touchmove", e => {
    e.preventDefault();

    let x = e.touches[0].clientX;
    let y = e.touches[0].clientY;

    posX += (x - x0) * 0.06;
    posY += (y - y0) * 0.06;

    posX = Math.max(5, Math.min(90, posX));
    posY = Math.max(5, Math.min(90, posY));

    posisi();

    x0 = x;
    y0 = y;
});
</script>

</body>
</html>
